<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>NEON AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300e5ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2 3 14h9l-1 8 10-12h-9Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 20V14M10 20V9M16 20V5M22 20V2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M8 16H3v5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5ZM14 2v6h6M8 13h8M8 17h6"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9Z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m10.85 12.15 8.4-8.4M18 5l3 3M15 8l2 2"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 8 10 8a13.2 13.2 0 0 1-1.67 2.68M6.61 6.61A13.5 13.5 0 0 0 2 12s3.5 8 10 8a9.7 9.7 0 0 0 5.39-1.61M2 2l20 20M9.88 9.88a3 3 0 0 0 4.24 4.24"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0ZM12 9v4M12 17h.01"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4ZM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8Z"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2ZM9 3v16M15 5v16"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6M12 19h8"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></symbol>
  </defs>
</svg>

<!-- atmosphere -->
<canvas id="fx" aria-hidden="true"></canvas>
<div class="atmos" aria-hidden="true">
  <div class="rays r1"></div><div class="rays r2"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="gridfloor"></div>
  <div class="vignette"></div>
  <div class="scan"></div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- auth -->
<section id="auth" class="auth hidden">
  <div class="auth-card spot" id="authCard">
    <div class="auth-logo"><span class="neon-logo flick" data-text="NEON AI">NEON AI</span></div>
    <p class="auth-sub">Your private AI workspace. Pick up any chat, on any device.</p>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-mode="login" role="tab">Sign in</button>
      <button type="button" class="tab" data-mode="signup" role="tab">Create account</button>
      <span class="tab-ink"></span>
    </div>

    <form id="authForm" novalidate autocomplete="on">
      <label class="field" id="fUser">
        <svg class="ic"><use href="#i-user"/></svg>
        <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24">
      </label>
      <label class="field" id="fPass">
        <svg class="ic"><use href="#i-lock"/></svg>
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" maxlength="72">
        <button type="button" id="togglePw" class="eye" aria-label="Show password" tabindex="-1"><svg class="ic"><use href="#i-eye"/></svg></button>
      </label>
      <div id="strength" class="strength" hidden>
        <div class="bars"><i></i><i></i><i></i><i></i></div>
        <span id="strengthTxt">At least 8 characters</span>
      </div>
      <label class="field" id="fInvite" hidden>
        <svg class="ic"><use href="#i-shield"/></svg>
        <input id="invite" name="answer" type="text" placeholder="What is your youngest cousin's name?" aria-label="What is your youngest cousin's name?" autocomplete="off" spellcheck="false" maxlength="60">
      </label>

      <label class="check">
        <input type="checkbox" id="remember" checked>
        <span class="box"><svg class="ic"><use href="#i-check"/></svg></span>
        <span class="check-txt">Keep me signed in for 30 days</span>
      </label>

      <div id="authErr" class="auth-err" role="alert"></div>
      <button class="btn primary big" id="authSubmit" type="submit"><span class="lbl">Sign in</span><span class="spin"></span></button>
    </form>
  </div>
</section>

<!-- app -->
<div id="app" class="app hidden">
  <aside id="sidebar">
    <div class="side-top">
      <span class="neon-logo small flick" data-text="NEON AI">NEON AI</span>
      <button id="closeSide" class="icon only-mobile" aria-label="Close menu"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <button id="newChat" class="btn primary wide"><svg class="ic"><use href="#i-plus"/></svg>New chat</button>
    <label class="searchbox">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="search" placeholder="Search chats" autocomplete="off">
    </label>
    <div id="chatList" class="chat-list"></div>
    <div class="side-bottom">
      <div class="me">
        <div class="avatar sm" id="meAvatar">?</div>
        <div class="me-name" id="meName"></div>
        <button id="settingsBtn" class="icon" aria-label="Settings" title="Settings"><svg class="ic"><use href="#i-sliders"/></svg></button>
        <button id="logoutBtn" class="icon" aria-label="Sign out" title="Sign out"><svg class="ic"><use href="#i-logout"/></svg></button>
      </div>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <main>
    <header>
      <button id="openSide" class="icon only-mobile" aria-label="Open menu"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div id="chatTitle" class="chat-title">New chat</div>
      <span id="syncDot" class="sync" title="Synced"></span>
      <div class="dd" id="modelDD">
        <select id="model" aria-label="Model" hidden></select>
        <button type="button" class="dd-btn" id="ddBtn" aria-haspopup="listbox" aria-expanded="false">
          <span class="dd-dot"></span><span class="dd-label" id="ddLabel"></span>
          <svg class="ic chev"><use href="#i-chev"/></svg>
        </button>
        <div class="dd-menu" id="ddMenu" role="listbox" aria-label="Choose a model"></div>
      </div>
      <div class="eff" id="eff">
        <button type="button" class="eff-btn" id="effBtn" aria-haspopup="dialog" aria-expanded="false" aria-label="Effort">
          <svg class="ic"><use href="#i-gauge"/></svg><span id="effBtnLabel">Medium</span>
        </button>
        <div class="eff-pop" id="effPop" role="dialog" aria-label="Effort">
          <button type="button" class="eff-reset" id="effReset" aria-label="Reset to Medium" title="Reset to Medium"><svg class="ic"><use href="#i-refresh"/></svg></button>
          <div class="eff-title" id="effTitle">Medium</div>
          <div class="eff-sub" id="effSub"></div>
          <div class="eff-slider" id="effSlider">
            <div class="eff-fill"></div>
            <i class="eff-dot" style="--k:0"></i><i class="eff-dot" style="--k:1"></i><i class="eff-dot" style="--k:2"></i><i class="eff-dot" style="--k:3"></i>
            <input type="range" id="effRange" min="0" max="3" step="1" value="1" aria-label="Effort level">
          </div>
          <div class="eff-ticks"><span>Low</span><span>Medium</span><span>High</span><span>Max</span></div>
          <p class="eff-desc" id="effDesc"></p>
        </div>
      </div>
    </header>

    <div id="messages" class="messages">
      <div id="empty" class="empty">
        <div class="hero"><span class="neon-logo huge flick" data-text="NEON AI">NEON AI</span></div>
        <p id="emptyMsg">What are we building today?</p>
        <div class="chips">
          <button class="chip spot"><svg class="ic"><use href="#i-bulb"/></svg><span>Explain quantum computing simply</span></button>
          <button class="chip spot"><svg class="ic"><use href="#i-terminal"/></svg><span>Write a Python web scraper</span></button>
          <button class="chip spot"><svg class="ic"><use href="#i-map"/></svg><span>Plan a 3-day trip to Tokyo</span></button>
          <button class="chip spot"><svg class="ic"><use href="#i-code"/></svg><span>Help me debug my code</span></button>
        </div>
      </div>
    </div>
    <button id="toBottom" class="to-bottom" aria-label="Scroll to latest"><svg class="ic"><use href="#i-down"/></svg></button>

    <div class="composer-wrap">
      <div id="attachments" class="attachments"></div>
      <div class="composer" id="composer">
        <button id="attachBtn" class="icon" aria-label="Attach files" title="Attach files"><svg class="ic"><use href="#i-clip"/></svg></button>
        <input id="fileInput" type="file" multiple hidden accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.jsx,.tsx,.py,.html,.css,.java,.c,.cpp,.cs,.go,.rs,.rb,.php,.sh,.sql,.yml,.yaml,.xml,.log,.toml,.ini">
        <textarea id="input" rows="1" placeholder="Message NEON AI"></textarea>
        <button id="send" class="send" aria-label="Send"><svg class="ic"><use href="#i-send"/></svg></button>
      </div>
      <div class="hint">Enter to send, Shift+Enter for a new line. Drop or paste images and files. AI can make mistakes.</div>
    </div>
  </main>
</div>

<!-- settings -->
<div id="settings" class="overlay hidden">
  <div class="card spot">
    <div class="card-head">
      <h3>Settings</h3>
      <button class="icon" id="closeSettings" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <label class="lbl">Signed in as</label>
    <div class="who"><div class="avatar sm" id="setAvatar">?</div><span id="setName"></span></div>
    <label class="lbl" for="sysPrompt">Custom instructions (optional, synced to your account)</label>
    <textarea id="sysPrompt" rows="5" placeholder="e.g. You are a pirate who explains code."></textarea>
    <div class="row">
      <button id="clearAll" class="btn danger"><svg class="ic"><use href="#i-trash"/></svg>Delete all chats</button>
      <span class="spacer"></span>
      <button id="saveSettings" class="btn primary">Save</button>
    </div>
  </div>
</div>

<!-- generic dialog -->
<div id="dialog" class="overlay hidden">
  <form class="card dlg spot" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <p id="dlgMsg" class="dlg-msg"></p>
    <input id="dlgInput" class="dlg-input" maxlength="120" autocomplete="off">
    <div class="row">
      <span class="spacer"></span>
      <button type="button" id="dlgCancel" class="btn">Cancel</button>
      <button type="submit" id="dlgOk" class="btn primary">OK</button>
    </div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/fx.js"></script>
<script src="/app.js"></script>
</body>
</html>
