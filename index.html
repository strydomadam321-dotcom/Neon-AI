<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg-grid"></div><div class="bg-glow g1"></div><div class="bg-glow g2"></div>

<div id="login" class="overlay hidden">
  <form class="login-card" id="loginForm">
    <div class="logo big">NEON<span>AI</span></div>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn primary" type="submit">Enter</button>
    <div id="loginErr" class="err"></div>
  </form>
</div>

<div class="app">
  <aside id="sidebar">
    <div class="side-top">
      <div class="logo">NEON<span>AI</span></div>
      <button id="closeSide" class="icon only-mobile" title="Close">✕</button>
    </div>
    <button id="newChat" class="btn primary wide">＋ New chat</button>
    <input id="search" class="search" placeholder="Search chats…">
    <div id="chatList" class="chat-list"></div>
    <div class="side-bottom">
      <button id="settingsBtn" class="btn wide">⚙ Settings</button>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <main>
    <header>
      <button id="openSide" class="icon only-mobile" title="Menu">☰</button>
      <div id="chatTitle" class="chat-title">New chat</div>
      <select id="model" title="Model"></select>
      <button id="exportBtn" class="icon" title="Export chat">⤓</button>
    </header>

    <div id="messages" class="messages">
      <div id="empty" class="empty">
        <div class="hero">NEON<span>AI</span></div>
        <p>Ask anything. Drop in images, PDFs, or code files.</p>
        <div class="chips">
          <button class="chip">Explain quantum computing simply</button>
          <button class="chip">Write a Python web scraper</button>
          <button class="chip">Plan a 3-day trip to Tokyo</button>
          <button class="chip">Help me debug my code</button>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div id="attachments" class="attachments"></div>
      <div class="composer" id="composer">
        <button id="attachBtn" class="icon" title="Attach files">📎</button>
        <input id="fileInput" type="file" multiple hidden accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.jsx,.tsx,.py,.html,.css,.java,.c,.cpp,.cs,.go,.rs,.rb,.php,.sh,.sql,.yml,.yaml,.xml,.log,.toml,.ini">
        <textarea id="input" rows="1" placeholder="Message NEON AI…  (Enter to send, Shift+Enter for new line)"></textarea>
        <button id="send" class="send" title="Send">➤</button>
      </div>
      <div class="hint">Drag &amp; drop or paste images/files. AI can make mistakes.</div>
    </div>
  </main>
</div>

<div id="settings" class="overlay hidden">
  <div class="card">
    <h3>Settings</h3>
    <label>System prompt (optional)</label>
    <textarea id="sysPrompt" rows="5" placeholder="e.g. You are a pirate who explains code."></textarea>
    <div class="row">
      <button id="clearAll" class="btn danger">Delete all chats</button>
      <span class="spacer"></span>
      <button id="closeSettings" class="btn primary">Done</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
